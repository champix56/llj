<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme.js &copy; Orsys</title>
    <script type="module" src="js/index.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css">

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/editor.css">
</head>

<body>
    <div id="main">
        <div id="header">Meme<span id="dot">.</span><span id="js">js</span></div>
        <div id="navbar">
            <ul>
                <li class="active"><a>Home</a></li>
                <li>|</li>
                <li><a>Thumbnail</a></li>
                <li>|</li>
                <li><a>Nouveau ...</a></li>
            </ul>
        </div>
        <div id="wrapper">
            <div id="editor">
                <div id="viewer">
                    <canvas id="canvas"></canvas>
                </div>
                <div id="memeform">
                    <form>
                        <label for="titre">
                            <h1>Titre</h1>
                        </label>
                        <br />
                        <input name="titre" id="titre" />
                        <hr />
                        <label for="image">
                            <h2>Image</h2>
                        </label>
                        <br />
                        <select name="image" id="image">
                            <option value="1">futurama1.jpg</option>
                            <option value="2">futurama2.png</option>
                            <option value="3">futurama3.png</option>
                            <option value="4">gwenadu.jpg</option>
                        </select>
                        <hr />
                        <label for="text">
                            <h2>texte</h2>
                        </label>
                        <br />
                        <input name="text" id="text" type="text" />
                        <br />
                        <h2>Position</h2>
                        <div class="inline-block">
                            <div>
                                <label for="x" class="bold block">
                                    x</label>
                                <input class="small-number" name="x" id="x" type="number"/>
                            </div>
                            <div>
                                <label for="y" class="bold block">
                                    y
                                </label>
                                <input class="small-number" name="y" id="y" type="number" />
                            </div>
                        </div>
                        <hr />
                        <br />
                        <h2>Decorations</h2>
                        <label for="color">
                            <h2 class="inline">color :</h2>
                        </label>
                        <input name="color" id="color" type="color" value="#FFFFFF" />
                        <br />
                        <label for="fontSize">
                            <h2 class="inline">font-size :</h2>
                        </label>
                        <input class="small-number" name="fontSize" id="fontSize" type="number" min="0" value="73" />
                        px
                        <br />
                        <label for="fontWeight">
                            <h2 class="inline">font-weight :</h2>
                        </label>
                        <input class="small-number" name="fontWeight" id="fontWeight" type="number" min="100" step="100"
                            max="900" value="900" />
                        <br />
                        <input name="underline" id="underline" type="checkbox" />
                        &nbsp;
                        <label for="underline">
                            <h2 class="inline">underline</h2>
                        </label>
                        &nbsp;<h2 class="inline">/</h2>
                        &nbsp;
                        <label for="italic">
                            <h2 class="inline">italic</h2>
                        </label>
                        &nbsp;
                        <input name="italic" id="italic" type="checkbox" />
                        <hr />
                        <br />
                        <h2 class="inline">frame size</h2>
                        <div class="inline-block">
                            <div>
                                <label for="frameSizeX" class="bold block">
                                    X
                                </label>
                                <input class="small-number block" name="frameSizeX" id="frameSizeX" type="number"
                                    min="0" value="0" />
                            </div>
                            <div>
                                <label for="frameSizeY" class="bold block">
                                    y
                                </label>
                                <input class="small-number block" name="frameSizeY" id="frameSizeY" type="number"
                                    min="0" value="0" />
                            </div>
                        </div>
                        <hr />
                        <div class="center-flex">
                            <button class="btn btn-danger" type="reset">Annul.</button>
                            <button class="btn btn-primary" type="submit">Valider</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div id="footer">copyright &copy;2026 Orsys</div>
    </div>
</body>

</html>
